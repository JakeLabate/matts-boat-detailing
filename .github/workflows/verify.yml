name: verify-demo2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          {
          for u in /lp/demo-components/ /img/demo/teak-before.jpg /img/demo/teak-after.jpg / ; do
            echo "$(curl -s -o /dev/null -w '%{http_code}' https://www.mbdmarinecare.com$u)  $u"
          done
          D=$(curl -s https://www.mbdmarinecare.com/lp/demo-components/)
          echo "ROBOTS: $(echo "$D" | grep -o 'content="noindex,nofollow"')"
          echo "CALC: $(echo "$D" | grep -c 'id="c-len"')"
          echo "PLANS: $(echo "$D" | grep -c 'id="w-cad"')"
          echo "COMPARE: $(echo "$D" | grep -c 'id="cmp"')"
          echo "MARINAS: $(echo "$D" | grep -c 'id="m-chips"')"
          echo "TRIAGE_QS: $(echo "$D" | grep -o 'data-q=' | wc -l)"
          echo "MAP: $(echo "$D" | grep -c 'class="tmap"')"
          echo "SITEMAP_DEMO: $(curl -s https://www.mbdmarinecare.com/sitemap.xml | grep -c 'demo-components')"
          } > demo_out.txt 2>&1
          cat demo_out.txt
      - run: |
          git config user.name ci; git config user.email ci@local
          git add demo_out.txt && git commit -m "temp: demo verify" && git push
