name: verify-urls
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe every landing page
        run: |
          : > url_status.txt
          for d in lp/*/; do
            u="/${d}"
            c=$(curl -s -o /dev/null -w '%{http_code}' "https://www.mbdmarinecare.com$u")
            echo "$c https://www.mbdmarinecare.com$u" >> url_status.txt
          done
          echo "checked: $(wc -l < url_status.txt)"
          echo "non-200: $(grep -vc '^200 ' url_status.txt || true)"
      - run: |
          git config user.name ci; git config user.email ci@local
          git add url_status.txt && git commit -m "temp: url status" && git push
