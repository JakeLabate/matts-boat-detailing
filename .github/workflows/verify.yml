name: verify-final
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          {
          echo "MAP_DEMO_SHOULD_404: $(curl -s -o /dev/null -w '%{http_code}' https://www.mbdmarinecare.com/map-demo/)"
          echo "SERVICE_AREAS: $(curl -s -o /dev/null -w '%{http_code}' https://www.mbdmarinecare.com/service-areas/)"
          echo "HOME: $(curl -s -o /dev/null -w '%{http_code}' https://www.mbdmarinecare.com/)"
          bad=0; n=0
          for d in *-boat-detailing/; do
            n=$((n+1))
            c=$(curl -s -o /dev/null -w '%{http_code}' "https://www.mbdmarinecare.com/$d")
            [ "$c" != "200" ] && { echo "BAD TOWN $c /$d"; bad=$((bad+1)); }
          done
          echo "TOWN_PAGES: $n  BAD: $bad"
          lb=0; ln=0
          for d in lp/*/; do
            ln=$((ln+1))
            c=$(curl -s -o /dev/null -w '%{http_code}' "https://www.mbdmarinecare.com/$d")
            [ "$c" != "200" ] && lb=$((lb+1))
          done
          echo "LP_PAGES: $ln  BAD: $lb"
          T=$(curl -s https://www.mbdmarinecare.com/milford-boat-detailing/)
          echo "TOWN_HASMAP_OLD: $(echo "$T" | grep -c 'map-demo')"
          echo "TOWN_HASMAP_NEW: $(echo "$T" | grep -c 'hasMap.*service-areas')"
          echo "SITEMAP_MAPDEMO: $(curl -s https://www.mbdmarinecare.com/sitemap.xml | grep -c 'map-demo')"
          echo "ORIG_TEAK_COMPOSITE: $(curl -s -o /dev/null -w '%{http_code}' https://www.mbdmarinecare.com/img/services/teak-restoration-before-after.jpg)"
          echo "ORIG_OXIDATION: $(curl -s -o /dev/null -w '%{http_code}' https://www.mbdmarinecare.com/img/services/resurgence-oxidation-removal.jpg)"
          echo "SERVICES_PAGE_IMG: $(curl -s https://www.mbdmarinecare.com/services/ | grep -c 'teak-restoration-before-after')"
          echo "SPLIT_TEAK_BEFORE: $(curl -s -o /dev/null -w '%{http_code}' https://www.mbdmarinecare.com/img/teak/teak-before.jpg)"
          } > verify_out.txt 2>&1
          cat verify_out.txt
      - run: |
          git config user.name ci; git config user.email ci@local
          git add verify_out.txt && git commit -m "temp: verify" && git push
