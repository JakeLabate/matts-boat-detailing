name: verify-ads
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe every landing page and the refinements
        run: |
          {
          bad=0; n=0
          for d in lp/*/; do
            u="/${d}"
            n=$((n+1))
            c=$(curl -s -o /dev/null -w '%{http_code}' "https://www.mbdmarinecare.com$u")
            if [ "$c" != "200" ]; then echo "BAD $c $u"; bad=$((bad+1)); fi
          done
          echo "LP_URLS_CHECKED: $n"
          echo "LP_URLS_BAD: $bad"
          P=$(curl -s https://www.mbdmarinecare.com/lp/boat-teak-restoration-essex-ct/)
          echo "MAP_SVG: $(echo "$P" | grep -c 'class="tmap"')"
          echo "MAP_LABEL: $(echo "$P" | grep -c 'ESSEX</text>')"
          echo "OWNER_IMG: $(echo "$P" | grep -c 'owner-matt.jpg')"
          echo "CALLBAR: $(echo "$P" | grep -c 'class="callbar"')"
          echo "CARDLESS_FORM: $(echo "$P" | grep -c 'formwrap{background:none')"
          echo "TRUST_CHIPS: $(echo "$P" | grep -c 'lp-trust')"
          echo "TABULAR_NUMS: $(echo "$P" | grep -c 'tabular-nums')"
          echo "OWNER_IMG_HTTP: $(curl -s -o /dev/null -w '%{http_code}' https://www.mbdmarinecare.com/img/owner-matt.jpg)"
          echo "HOME: $(curl -s -o /dev/null -w '%{http_code}' https://www.mbdmarinecare.com/)"
          echo "TOWN_PAGE: $(curl -s -o /dev/null -w '%{http_code}' https://www.mbdmarinecare.com/milford-boat-detailing/)"
          echo "SITEMAP_LP: $(curl -s https://www.mbdmarinecare.com/sitemap.xml | grep -c '/lp/')"
          echo "ROBOTS_DISALLOW: $(curl -s https://www.mbdmarinecare.com/robots.txt | grep -ci '^disallow')"
          } > verify_out.txt 2>&1
          cat verify_out.txt
      - run: |
          git config user.name ci; git config user.email ci@local
          git add verify_out.txt && git commit -m "temp: verify" && git push
