name: verify-lp
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          {
          for u in / /services/ /milford-boat-detailing/ /robots.txt /sitemap.xml \
                   /lp/boat-teak-restoration-essex-ct/ /lp/boat-ceramic-coating-stonington-ct/ \
                   /img/owner-matt.jpg /img/logo-mark.png ; do
            echo "$(curl -s -o /dev/null -w '%{http_code}' https://www.mbdmarinecare.com$u)  $u"
          done
          P=$(curl -s https://www.mbdmarinecare.com/lp/boat-teak-restoration-essex-ct/)
          echo "MAP_SVG: $(echo "$P" | grep -c 'class=\"tmap\"')"
          echo "MAP_LABEL: $(echo "$P" | grep -o 'ESSEX</text>' | head -1)"
          echo "OWNER_IMG: $(echo "$P" | grep -c 'owner-matt.jpg')"
          echo "CALLBAR: $(echo "$P" | grep -c 'class=\"callbar\"')"
          echo "FORM_CARDLESS: $(echo "$P" | grep -c 'formwrap{background:none')"
          echo "TRUST_CHIPS: $(echo "$P" | grep -c 'lp-trust')"
          echo "ROBOTS_META: $(echo "$P" | grep -o 'content=\"noindex,follow\"')"
          echo "SITEMAP_LP: $(curl -s https://www.mbdmarinecare.com/sitemap.xml | grep -c '/lp/')"
          } > verify_out.txt 2>&1
          cat verify_out.txt
      - run: |
          git config user.name ci; git config user.email ci@local
          git add verify_out.txt && git commit -m "temp: verify" && git push
