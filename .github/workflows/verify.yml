name: verify-lp
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          {
          for u in / /services/ /milford-boat-detailing/ /robots.txt /sitemap.xml \
                   /lp/boat-ceramic-coating-stonington-ct/ \
                   /lp/boat-wash-and-wax-west-haven-ct/ \
                   /lp/boat-shrink-wrapping-old-lyme-ct/ \
                   /lp/boat-teak-restoration-essex-ct/ \
                   /fonts/fonts.css /img/logo-mark.png ; do
            echo "$(curl -s -o /dev/null -w '%{http_code}' https://www.mbdmarinecare.com$u)  $u"
          done
          echo "ROBOTS:"; curl -s https://www.mbdmarinecare.com/robots.txt | grep -iE 'disallow|allow:'
          echo "LPHEAD:"; curl -s https://www.mbdmarinecare.com/lp/boat-ceramic-coating-stonington-ct/ | grep -oE '<title>[^<]*|content="noindex,follow"|href="https://www.mbdmarinecare.com/lp/[^"]*"' | head -3
          echo "SITEMAP_LP_COUNT:"; curl -s https://www.mbdmarinecare.com/sitemap.xml | grep -c '/lp/' || true
          } > verify_out.txt 2>&1
          cat verify_out.txt
      - name: commit
        run: |
          git config user.name ci; git config user.email ci@local
          git add verify_out.txt && git commit -m "temp: verify output" && git push
