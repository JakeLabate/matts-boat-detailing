name: verify-spelling
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: audit live site
        run: |
          {
          echo "== repo-wide spelling audit (html only) =="
          for w in harbour oxidis centre neighbour authoris colour favourite theatre fuelling personalis realis organis whilst amongst licence defence; do
            c=$(grep -ril "$w" --include=*.html . | wc -l)
            echo "  $w: $c files"
          done
          echo "  programme: $(grep -ril 'programme' --include=*.html . | wc -l) files"
          echo "== em dashes =="
          echo "  mdash: $(grep -rl 'mdash\|—' --include=*.html . | wc -l) files"
          echo "== live spot checks =="
          echo "  HOME: $(curl -s -o /dev/null -w '%{http_code}' https://www.mbdmarinecare.com/)"
          echo "  SERVICES: $(curl -s -o /dev/null -w '%{http_code}' https://www.mbdmarinecare.com/services/)"
          echo "  MILFORD: $(curl -s -o /dev/null -w '%{http_code}' https://www.mbdmarinecare.com/milford-boat-detailing/)"
          echo "  LP: $(curl -s -o /dev/null -w '%{http_code}' https://www.mbdmarinecare.com/lp/boat-ceramic-coating-stonington-ct/)"
          echo "  live harbour count on burrs-marina: $(curl -s https://www.mbdmarinecare.com/marinas/burrs-marina/ | grep -ci harbour)"
          echo "  live harbor count on burrs-marina: $(curl -s https://www.mbdmarinecare.com/marinas/burrs-marina/ | grep -ci harbor)"
          echo "  Safe Harbor intact: $(grep -rl 'Safe Harbor' --include=*.html . | wc -l) files"
          } > verify_out.txt 2>&1
          cat verify_out.txt
      - run: |
          git config user.name ci; git config user.email ci@local
          git add verify_out.txt && git commit -m "temp: verify" && git push
